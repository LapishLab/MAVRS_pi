---
recordings:
  video: True
  audio: True
  gpio: True

camera:
  sensor_mode: HDR # options: [HDR, high_res, medium_res, low_res]
  # resolution: [1280, 720] # optional; defaults based on the selected sensor mode
  # autofocus: False # optional; true enables continuous autofocus
  # lens_position: 0.0 # optional manual focus; 0.0 is infinity, larger values focus closer
  quality : MEDIUM  #VERY_HIGH, HIGH, MEDIUM, LOW, VERY_LOW

display:
  enable: True
  size_x: 800
  size_y: 480
  horizontal_flip: False
  vertical_flip: False
  title_fields: ["ExposureTime", "FrameDuration", "Lux"]

 
