conky.config = {
    alignment = 'top_right',
    background = true,
    cpu_avg_samples = 2,
    default_color = 'white',
    double_buffer = true,
    font = 'Sans:size=12:bold',
    gap_x = 20,
    gap_y = 50,
    own_window = true,
    own_window_type = 'override',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 2.0,
    use_xft = true,
    short_units = true,
}

conky.text = [[
Name:  $nodename
Ethernet:  ${addr eth0}
Wi-Fi:  ${addr wlan0}

CPU:  ${cpu cpu0}% (${cpu cpu1}:${cpu cpu2}:${cpu cpu3}:${cpu cpu4})
RAM:  ${memperc}% (${mem}/${memmax})
SWAP:  ${swapperc}% (${swap}/${swapmax})
]]
